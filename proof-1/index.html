<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PlaneCode Proof-2 Shadow Lab</title>
  <link rel="stylesheet" href="./renderer.css?v=11">
</head>
<body>
  <main id="plane-code-root"></main>

  <section id="shadow-controls" aria-label="Настройка тени">
    <h2>Тень панелей</h2>

    <label>Z — высота панели <output id="shadow-z-output">4</output>
      <input id="shadow-z" type="range" min="0" max="20" step="0.1" value="4">
      <input id="shadow-z-number" type="number" min="0" max="20" step="0.1" value="4">
    </label>

    <label>Отступ панелей <output id="panel-spacing-output">20 px</output>
      <input id="panel-spacing" type="range" min="0" max="60" step="1" value="20">
      <input id="panel-spacing-number" type="number" min="0" max="60" step="1" value="20">
    </label>

    <div id="shadow-derived">
      <span>X</span><output id="shadow-x-output">4 px</output>
      <span>Y</span><output id="shadow-y-output">4 px</output>
      <span>Размытие</span><output id="shadow-blur-output">4 px</output>
      <span>Расширение</span><output id="shadow-spread-output">0.6 px</output>
    </div>

    <label class="control-row">Цвет
      <input id="shadow-color" type="color" value="#666666">
      <input id="shadow-color-text" type="text" value="#666666" inputmode="text">
    </label>

    <label class="control-row">Внутренняя тень (inset)
      <input id="shadow-inset" type="checkbox">
    </label>

    <output id="shadow-css">box-shadow: 4px 4px 0px 0px #666666;</output>
  </section>

  <script type="module" src="./main.js?v=11"></script>
</body>
</html>
