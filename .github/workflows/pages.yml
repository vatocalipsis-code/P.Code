name: Test and deploy P.Code
# layout-group target preview

on:
  push:
    branches: ["main", "feature/container-layout-trial", "feature/canonical-editable-input-v1", "feature/theme-skin-editor-v1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contract tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/container-layout-trial'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/runtime _site/release _site/assets _site/icons _site/editor
          cp web/index.html _site/index.html
          cp web/main.js _site/main.js
          cp web/sw.js _site/sw.js
          cp web/manifest.webmanifest _site/manifest.webmanifest
          cp web/assets/*.png _site/assets/
          cp web/icons/*.png _site/icons/
          cp runtime/renderer.css _site/runtime/renderer.css
          cp runtime/compositor.js _site/runtime/compositor.js
          cp runtime/setlang-compiler.js _site/runtime/setlang-compiler.js
          cp runtime/web-renderer.js _site/runtime/web-renderer.js
          cp runtime/validator.js _site/runtime/validator.js
          cp runtime/public-runtime-core.js _site/runtime/public-runtime-core.js
          cp runtime/public-runtime.js _site/runtime/public-runtime.js
          cp runtime/render-bindings.js _site/runtime/render-bindings.js
          cp editor/index.html editor/editor.js editor/editor.css editor/spl.js _site/editor/
          cp release/set-lang.js _site/release/set-lang.js
          cp release/set-data.js _site/release/set-data.js
          cp release/set-render.js _site/release/set-render.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
